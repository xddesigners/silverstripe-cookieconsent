    DefaultContent: '<p>Utilizamos cookies para personalizar el contenido, ofrecer funciones de redes sociales y analizar nuestro tráfico. También compartimos información sobre el uso que hace de nuestro sitio con nuestros socios de redes sociales y de análisis, quienes pueden combinarla con otra información que usted les haya proporcionado o que hayan recopilado a partir del uso que usted hace de sus servicios.</p>'

